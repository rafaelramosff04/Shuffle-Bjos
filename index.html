<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio de Funções</title>
<style>
:root{--bg:#161615;--card:#21211f;--text:#eeeeea;--muted:#9a9a93;--accent:#6c9cf0;--border:#3a3a36;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;max-width:560px;margin:0 auto 14px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
label{display:block;margin-bottom:6px;font-size:14px}
select,button,input[type="file"]{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)}
button{cursor:pointer}
button.primary{background:var(--accent);color:#fff;border:none}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;margin-top:12px}
.row>*{flex:1}
.fora{font-weight:600;border-left:4px solid var(--accent);padding:6px 10px;margin:0 0 12px}
.linha{margin:4px 0;line-height:1.6;font-size:15px}
.aviso{color:var(--muted);font-size:14px;min-height:18px;margin-top:8px}
details summary{cursor:pointer;font-weight:600}
.ciclo-hist{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fade .2s ease}
.popup-conteudo{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:32px 40px;text-align:center;max-width:90%}
.popup-conteudo small{color:var(--muted);font-size:16px;text-transform:uppercase;letter-spacing:2px}
.popup-conteudo .nome{display:block;font-size:40px;font-weight:700;margin-top:10px;color:var(--text)}
[hidden]{display:none!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<div class="card">
  <h1>Sorteio Bjos me liga</h1>
  <div id="ciclo" class="muted">Carregando...</div>
</div>

<div class="card" style="text-align:center">
  <canvas id="roleta" width="300" height="300" style="display:block;margin:0 auto;max-width:100%"></canvas>
  <div id="vencedor" class="muted" style="margin:10px 0;min-height:20px"></div>
  <button id="girar" class="primary">Sortear vagabundo</button>
</div>

<div class="card">
  <label for="livre">Vagabunde da semana</label>
  <select id="livre"></select>
  <div class="row">
    <button id="sortear" class="primary" style="background-color:#d38725;">Sortear funções</button>
    <button id="salvar" disabled style="background-color:#1ea5f3;">Salvar sorteio</button>
  </div>
  <div id="aviso" class="aviso"></div>
</div>

<div class="card" id="area-resultado" hidden>
  <h2>Resultado do sorteio</h2>
  <div id="resultado"></div>
</div>

<button id="whatsapp" class="primary" style="display:block;margin:0 auto 14px;max-width:560px;width:calc(100% - 32px);background-color:#25D366;" hidden>Enviar no WhatsApp</button>

<div class="card">
  <details>
    <summary>Histórico</summary>
    <div id="historico" class="muted" style="margin-top:10px">Sem ciclos salvos.</div>
    <!-- <div class="ciclo-hist">
      <label for="importar">Importar historico.json de uma versão anterior</label>
      <input type="file" id="importar" accept=".json,application/json">
    </div> -->
  </details>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== CONFIGURAÇÃO DO SEU PROJETO FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyCIttkyB5qxoY_p7P5UtewA4fOr-2-3Bao",
  authDomain: "shuffle-bjos.firebaseapp.com",
  projectId: "shuffle-bjos",
  storageBucket: "shuffle-bjos.firebasestorage.app",
  messagingSenderId: "738160296199",
  appId: "1:738160296199:web:0fdf89d422c39a8d31c5a2"
};
// ==================================================

const PESSOAS = [
  "Akuira", "Binho", "Biobio", "Bobadilla", "Boninho", "Botelho", "Chuvis",
  "Creu", "Dalan", "Grinch", "Malala", "Raposo", "Recruta"
];

const FUNCOES = [
  "Cozinha", "Cozinha", "Cozinha",
  "Sala", "Sala",
  "Área Externa", "Área Externa", "Área Externa",
  "Banheiros",
  "Corredor",
  "Panos",
  "Lavanderia"
];

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let ciclos = [];
let atual = null;        // último sorteio feito, aguardando "Salvar sorteio"
let ultimoSalvo = null;  // último ciclo salvo, usado no envio pelo WhatsApp
let disponiveis = [...PESSOAS]; // lista cópia de quem ainda pode ser vagabundo

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function formatarData(iso) {
  if (!iso) return "";
  const [ano, mes, dia] = iso.split("-");
  return `${dia}/${mes}/${ano}`;
}

function numeroCiclo() {
  return ciclos.length + 1;
}

function vagabundosDisponiveis() {
  return disponiveis.length ? disponiveis : PESSOAS;
}

function recebidasPorPessoa() {
  const r = {};
  PESSOAS.forEach(p => r[p] = new Set());
  ciclos.forEach(c => {
    Object.entries(c.atribuicoes || {}).forEach(([p, f]) => {
      if (r[p]) r[p].add(f);
    });
  });
  return r;
}

function embaralhar(lista) {
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sortearComHistorico(ativas, funcoes, recebidas, tentativas = 10000) {
  let melhor = null;
  let menorRep = Infinity;
  for (let t = 0; t < tentativas; t++) {
    const f = embaralhar(funcoes);
    const at = {};
    ativas.forEach((p, i) => at[p] = f[i]);
    const rep = ativas.reduce((n, p) => n + (recebidas[p].has(at[p]) ? 1 : 0), 0);
    if (rep === 0) return { at, rep: 0 };
    if (rep < menorRep) { menorRep = rep; melhor = at; }
  }
  return { at: melhor, rep: menorRep };
}

function atualizarCiclo() {
  const faltam = vagabundosDisponiveis().length;
  $("ciclo").textContent = `Ciclo ${numeroCiclo()} - ${new Date().toLocaleDateString("pt-BR")} · Faltam ${faltam} vagabundes`;
}

function atualizarHistorico() {
  const el = $("historico");
  if (!ciclos.length) { el.textContent = "Sem ciclos salvos."; return; }
  el.innerHTML = ciclos.slice().reverse().map(c => {
    const porFuncao = {};
    Object.entries(c.atribuicoes || {}).forEach(([p, f]) => {
      (porFuncao[f] = porFuncao[f] || []).push(p);
    });

    const linhas = [...new Set(FUNCOES)]
      .map(f => `<b>${esc(f)}:</b> ${esc((porFuncao[f] || []).join(" | "))}`)
      .join("<br>");

    return `<div class="ciclo-hist">
      <div><b>Ciclo ${esc(c.ciclo)}</b> <span class="muted">(${esc(formatarData(c.data))})</span></div>
      <div class="linha" style="font-size:14px;margin-top:6px">
        <b>Vagabunde:</b> ${esc(c.livre || "-")}<br>
        ${linhas}
      </div>
    </div>`;
  }).join("");
}

function mostrarResultado(livre, at, rep) {
  const porFuncao = {};
  Object.entries(at).forEach(([p, f]) => {
    (porFuncao[f] = porFuncao[f] || []).push(p);
  });

  let html = `<div class="fora">VAGABUNDO: ${esc(livre.toUpperCase())}</div>`;
  [...new Set(FUNCOES)].forEach(f => {
    const nomes = (porFuncao[f] || []).join(" | ");
    html += `<div class="linha"><b>${esc(f)}:</b> ${esc(nomes)}</div>`;
  });

  $("resultado").innerHTML = html;
  $("area-resultado").hidden = false;
}

function sortear() {
  const livre = $("livre").value;
  const ativas = PESSOAS.filter(p => p !== livre);

  if (ativas.length !== FUNCOES.length) {
    $("aviso").textContent = `${ativas.length} pessoas ativas e ${FUNCOES.length} funções. Ajuste as listas.`;
    return;
  }

  const { at, rep } = sortearComHistorico(ativas, FUNCOES, recebidasPorPessoa());
  atual = { livre, at };
  mostrarResultado(livre, at, rep);
  $("salvar").disabled = false;
  $("whatsapp").hidden = true; // esconde o envio do ciclo anterior até salvar o novo
  $("aviso").textContent = "Confira o resultado. Salve antes de enviar pelo Whatsapp.";
}

async function salvar() {
  if (!atual) return;
  $("salvar").disabled = true;
  try {
    const registro = {
      ciclo: numeroCiclo(),
      data: new Date().toISOString().slice(0, 10),
      ts: Date.now(),
      livre: atual.livre,
      atribuicoes: atual.at,
    };
    await setDoc(doc(db, "ciclos", "c" + Date.now()), registro);

    // remove o vagabundo da lista cópia; se acabar, recomeça com todos
    let restantes = vagabundosDisponiveis().filter(p => p !== atual.livre);
    if (restantes.length === 0) restantes = [...PESSOAS];
    await setDoc(doc(db, "config", "roleta"), { disponiveis: restantes });

    ultimoSalvo = registro;
    $("aviso").textContent = "Ciclo salvo. Pode enviar no Whatsapp.";
    $("area-resultado").hidden = true;
    $("whatsapp").hidden = false;
    atual = null;
  } catch (e) {
    $("salvar").disabled = false;
    $("aviso").textContent = "Não foi possível salvar: " + e.message;
  }
}

async function importarArquivo(evento) {
  const arquivo = evento.target.files[0];
  if (!arquivo) return;
  try {
    const dados = JSON.parse(await arquivo.text());
    const lista = dados.ciclos || [];
    for (let i = 0; i < lista.length; i++) {
      const c = lista[i];
      await setDoc(doc(db, "ciclos", "import" + i), {
        ciclo: c.ciclo,
        data: c.data,
        ts: i,
        livre: c.livre,
        atribuicoes: c.atribuicoes,
      });
    }
    $("aviso").textContent = `${lista.length} ciclos importados.`;
  } catch (e) {
    $("aviso").textContent = "Erro ao importar: " + e.message;
  }
  evento.target.value = "";
}

// ====== WHATSAPP ======
function textoWhatsApp(ciclo) {
  const porFuncao = {};
  Object.entries(ciclo.atribuicoes).forEach(([p, f]) => {
    (porFuncao[f] = porFuncao[f] || []).push(p);
  });

  const linhas = [
    `*Sorteio de Funções - Ciclo ${ciclo.ciclo}*`,
    `Vagabundo: *${ciclo.livre}*`,
    ""
  ];
  [...new Set(FUNCOES)].forEach(f => {
    linhas.push(`*${f}:* ${(porFuncao[f] || []).join(" | ")}`);
  });
  return linhas.join("\n");
}

function enviarWhatsApp() {
  if (!ultimoSalvo) return;
  const texto = textoWhatsApp(ultimoSalvo);
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
}
// ====== FIM DO WHATSAPP ======

// ====== ROLETA ======
const CORES = ["#e63946", "#f4a261", "#2a9d8f", "#457b9d", "#8338ec", "#ffbe0b",
  "#06d6a0", "#ef476f", "#118ab2", "#fb5607", "#3a86ff", "#ff006e", "#8ac926"];
let angulo = 0;
let girando = false;

// ====== SOM ======
let audioCtx = null;
function audio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tocar(freq, duracao, tipo = "square", volume = 0.08, atraso = 0) {
  const ctx = audio();
  const osc = ctx.createOscillator();
  const ganho = ctx.createGain();
  const t = ctx.currentTime + atraso;
  osc.type = tipo;
  osc.frequency.value = freq;
  ganho.gain.setValueAtTime(volume, t);
  ganho.gain.exponentialRampToValueAtTime(0.0001, t + duracao);
  osc.connect(ganho).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + duracao);
}

const tick = () => tocar(1800, 0.03, "square", 0.05);

function fanfarra() {
  [523, 659, 784, 1047].forEach((f, i) => tocar(f, 0.25, "triangle", 0.12, i * 0.12));
}

// ====== CONFETES ======
function confetes() {
  const canvas = document.createElement("canvas");
  canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1001";
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");

  const cores = ["#e63946", "#f4a261", "#ffbe0b", "#06d6a0", "#3a86ff", "#ff006e", "#8338ec"];
  const pecas = Array.from({ length: 160 }, () => ({
    x: canvas.width / 2 + (Math.random() - 0.5) * 120,
    y: canvas.height,
    vx: (Math.random() - 0.5) * 16,
    vy: -(Math.random() * 16 + 12),
    tam: Math.random() * 6 + 5,
    cor: cores[Math.floor(Math.random() * cores.length)],
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.3,
  }));

  let quadros = 0;
  function animar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pecas.forEach(p => {
      p.vy += 0.35;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.cor;
      ctx.fillRect(-p.tam / 2, -p.tam / 4, p.tam, p.tam / 2);
      ctx.restore();
    });
    quadros++;
    if (quadros < 200) requestAnimationFrame(animar);
    else canvas.remove();
  }
  animar();
}

function desenharRoleta(nomes = vagabundosDisponiveis()) {
  const canvas = $("roleta");
  const ctx = canvas.getContext("2d");
  const r = canvas.width / 2;
  const fatia = (2 * Math.PI) / nomes.length;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  nomes.forEach((nome, i) => {
    const ini = angulo + i * fatia;
    ctx.beginPath();
    ctx.moveTo(r, r);
    ctx.arc(r, r, r - 4, ini, ini + fatia);
    ctx.closePath();
    ctx.fillStyle = CORES[i % CORES.length];
    ctx.fill();

    ctx.save();
    ctx.translate(r, r);
    ctx.rotate(ini + fatia / 2);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(nome, r - 16, 5);
    ctx.restore();
  });

  // ponteiro fixo no topo
  ctx.beginPath();
  ctx.moveTo(r - 12, 0);
  ctx.lineTo(r + 12, 0);
  ctx.lineTo(r, 24);
  ctx.closePath();
  ctx.fillStyle = "#1d1d1b";
  ctx.fill();
}

function mostrarPopup(nome) {
  document.querySelector(".popup")?.remove();

  const popup = document.createElement("div");
  popup.className = "popup";
  popup.innerHTML = `
    <div class="popup-conteudo">
      <small>Vagabunde da semana</small>
      <span class="nome">${esc(nome)}</span>
    </div>`;
  document.body.appendChild(popup);

  fanfarra();
  confetes();
  setTimeout(() => popup.remove(), 3000);
}

function girarRoleta() {
  if (girando) return;
  const nomes = vagabundosDisponiveis();
  girando = true;
  $("girar").disabled = true;
  $("vencedor").textContent = "";
  audio(); // libera o som, que precisa de um clique do usuário

  const fatia = (2 * Math.PI) / nomes.length;
  const vencedor = Math.floor(Math.random() * nomes.length);

  // ângulo final em que a fatia do vencedor fica sob o ponteiro (topo)
  const alvo = -Math.PI / 2 - (vencedor + 0.5) * fatia;
  const inicio = angulo;
  let delta = (alvo - inicio) % (2 * Math.PI);
  if (delta < 0) delta += 2 * Math.PI;
  const total = delta + 2 * Math.PI * (4 + Math.floor(Math.random() * 3));

  const duracao = 4000;
  const t0 = performance.now();
  let ultimoSetor = null;

  function quadro(agora) {
    const p = Math.min((agora - t0) / duracao, 1);
    const suavizado = 1 - Math.pow(1 - p, 3);
    angulo = inicio + total * suavizado;
    desenharRoleta(nomes);

    // tique sempre que um setor passa pelo ponteiro
    const rel = (((-Math.PI / 2 - angulo) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const setor = Math.floor(rel / fatia);
    if (setor !== ultimoSetor) {
      ultimoSetor = setor;
      tick();
    }

    if (p < 1) {
      requestAnimationFrame(quadro);
    } else {
      girando = false;
      $("girar").disabled = false;
      const nome = nomes[vencedor];
      $("livre").value = nome;
      $("vencedor").innerHTML = `Vagabundo: <b>${esc(nome)}</b>`;
      mostrarPopup(nome);
    }
  }
  requestAnimationFrame(quadro);
}
// ====== FIM DA ROLETA ======

function iniciar() {
  $("livre").innerHTML = PESSOAS.map(p => `<option>${esc(p)}</option>`).join("");
  $("sortear").addEventListener("click", sortear);
  $("salvar").addEventListener("click", salvar);
  $("girar").addEventListener("click", girarRoleta);
  $("whatsapp").addEventListener("click", enviarWhatsApp);
  desenharRoleta();
  atualizarCiclo();

  onSnapshot(collection(db, "ciclos"), snap => {
    ciclos = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.ts || 0) - (b.ts || 0));
    atualizarCiclo();
    atualizarHistorico();
  }, err => {
    $("aviso").textContent = "Erro ao carregar o histórico: " + err.message;
  });

  onSnapshot(doc(db, "config", "roleta"), snap => {
    disponiveis = snap.exists() ? (snap.data().disponiveis || []) : [...PESSOAS];
    atualizarCiclo();
    if (!girando) desenharRoleta();
  }, err => {
    $("aviso").textContent = "Erro ao carregar a lista de vagabundos: " + err.message;
  });
}

iniciar();
</script>
</body>
</html>
